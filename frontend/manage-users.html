<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCMS Manage Users</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<script src="js/config.js"></script>
<script src="js/mock-api.js"></script>
<script src="sidebar.js"></script>
</head><body>
<script>document.write(sharedCSS);</script>
<style>
.user-row-avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:white;}
</style>
<script>requireAdmin(); document.write(renderAdminSidebar('manage-users'));</script>
<div class="main">
  <div class="page-header">
    <div class="page-title"><h1>Manage Users</h1><p>Add, view, and remove system users</p></div>
    <button class="btn btn-primary" onclick="toggleForm()"><i class="fa fa-plus"></i> Add User</button>
  </div>

  <div class="box" id="addForm" style="display:none;margin-bottom:20px;">
    <div class="box-header"><span class="box-title">➕ Add New User</span>
      <button class="btn btn-sm" style="background:var(--surface2);color:var(--muted)" onclick="toggleForm()">✕ Cancel</button>
    </div>
    <div class="form-grid">
      <div class="fg"><label>Full Name</label><input type="text" id="uName" placeholder="e.g. Ahmed Khan"></div>
      <div class="fg"><label>Email</label><input type="email" id="uEmail" placeholder="ahmed@gmail.com"></div>
      <div class="fg"><label>Password</label><input type="text" id="uPass" placeholder="default: user123" value="user123"></div>
      <div class="fg"><label>Role</label>
        <select id="uRole"><option value="Resident">Resident</option><option value="Guard">Guard</option><option value="Admin">Admin</option></select>
      </div>
      <div class="fg"><label>Phone</label><input type="text" id="uPhone" placeholder="0300-1234567"></div>
      <div class="fg"><label>Apartment (Residents only)</label><input type="text" id="uApt" placeholder="e.g. A-203"></div>
    </div>
    <div id="addErrMsg" style="color:#f87171;font-size:13px;margin-bottom:12px;display:none"></div>
    <button class="btn btn-primary" onclick="addUser()"><i class="fa fa-save"></i> Save User</button>
  </div>

  <div class="box">
    <div class="box-header"><span class="box-title">All Users</span></div>
    <div class="search-bar"><i class="fa fa-search"></i><input type="text" id="searchInput" placeholder="Search by name, email, apartment..." oninput="render()"></div>
    <div class="filter-tabs">
      <button class="filter-tab active" onclick="setFilter('All',this)">All</button>
      <button class="filter-tab" onclick="setFilter('Admin',this)">👑 Admin</button>
      <button class="filter-tab" onclick="setFilter('Resident',this)">🏠 Resident</button>
      <button class="filter-tab" onclick="setFilter('Guard',this)">🛡 Guard</button>
    </div>
    <table><thead><tr><th></th><th>Name</th><th>Email</th><th>Role</th><th>Apartment</th><th>Phone</th><th>Action</th></tr></thead>
    <tbody id="usersBody"><tr><td colspan="7" style="text-align:center;color:var(--muted);padding:30px"><i class="fa fa-spinner spin"></i></td></tr></tbody></table>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
let allUsers=[]; let currentFilter='All';
function toggleForm(){const f=document.getElementById('addForm');f.style.display=f.style.display==='none'?'block':'none';}
async function loadUsers(){
  try{const res=await fetch(API+'/users'); allUsers=await res.json(); render();}
  catch(e){}
}
function render(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  let filtered=allUsers.filter(u=>
    (currentFilter==='All'||u.role===currentFilter)&&
    ((u.name||'').toLowerCase().includes(q)||(u.email||'').toLowerCase().includes(q)||(u.apartment||'').toLowerCase().includes(q))
  );
  const tbody=document.getElementById('usersBody');
  if(!filtered.length){tbody.innerHTML='<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:30px">No users found.</td></tr>';return;}
  const rc={Admin:'badge-purple',Resident:'badge-green',Guard:'badge-blue'};
  tbody.innerHTML=filtered.map(u=>`
    <tr>
      <td><div class="user-row-avatar">${(u.name||'U')[0].toUpperCase()}</div></td>
      <td><strong>${u.name}</strong></td>
      <td style="color:var(--muted)">${u.email}</td>
      <td><span class="badge ${rc[u.role]||'badge-blue'}">${u.role}</span></td>
      <td>${u.apartment||'—'}</td>
      <td style="color:var(--muted)">${u.phone||'—'}</td>
      <td>${u.id!==user.id?`<button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id},'${u.name}')"><i class="fa fa-trash"></i></button>`:'<span style="color:var(--muted);font-size:12px">You</span>'}</td>
    </tr>`).join('');
}
function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.filter-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}
async function addUser(){
  const data={name:document.getElementById('uName').value.trim(),email:document.getElementById('uEmail').value.trim(),password:document.getElementById('uPass').value.trim(),role:document.getElementById('uRole').value,phone:document.getElementById('uPhone').value.trim(),apartment:document.getElementById('uApt').value.trim()};
  if(!data.name||!data.email||!data.password){showToast('Name, email and password are required','error');return;}
  const errDiv=document.getElementById('addErrMsg');
  try{
    const res=await fetch(API+'/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    const d=await res.json();
    if(d.success){showToast('User added!','success');document.getElementById('addForm').style.display='none';loadUsers();}
    else{errDiv.textContent=d.message||'Failed to add user.';errDiv.style.display='block';}
  }catch(e){showToast('Failed to add user','error');}
}
async function deleteUser(id,name){
  if(!confirm(`Delete user "${name}"? This cannot be undone.`))return;
  try{await fetch(API+'/users?id='+id,{method:'DELETE'});showToast('User deleted','success');loadUsers();}
  catch(e){showToast('Delete failed','error');}
}
function showToast(msg,type){const t=document.getElementById('toast');t.className=`toast toast-${type} show`;t.innerHTML=`<i class="fa ${type==='success'?'fa-check-circle':'fa-exclamation-circle'}"></i> ${msg}`;setTimeout(()=>t.classList.remove('show'),3000);}
loadUsers();
</script>
</body></html>
