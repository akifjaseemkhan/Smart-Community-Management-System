<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCMS Visitors</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<script src="js/config.js"></script>
<script src="js/mock-api.js"></script>
<script src="sidebar.js"></script>
</head><body>
<script>document.write(sharedCSS);</script>
<style>
.visitor-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px;transition:0.3s;}
.visitor-card:hover{border-color:rgba(99,102,241,0.3);transform:translateY(-2px);}
.vc-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:14px;}
.vc-user{display:flex;align-items:center;gap:12px;}
.vc-avatar{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:white;flex-shrink:0;}
.vc-name{font-size:15px;font-weight:700;margin-bottom:2px;}
.vc-sub{color:var(--muted);font-size:13px;}
.vc-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px;}
.meta-item{background:var(--surface2);border-radius:10px;padding:10px 12px;}
.meta-item label{display:block;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:3px;}
.meta-item span{font-size:13px;font-weight:500;}
.vc-actions{display:flex;gap:10px;flex-wrap:wrap;}
.btn-approve{background:rgba(34,197,94,0.12);color:#22c55e;border:1px solid rgba(34,197,94,0.2);padding:8px 18px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;transition:0.2s;}
.btn-approve:hover{background:#22c55e;color:white;}
.btn-reject{background:rgba(239,68,68,0.12);color:#ef4444;border:1px solid rgba(239,68,68,0.2);padding:8px 18px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;transition:0.2s;}
.btn-reject:hover{background:#ef4444;color:white;}
.btn-del{background:transparent;color:var(--muted);border:1px solid var(--border);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px;transition:0.2s;}
.btn-del:hover{color:#ef4444;border-color:rgba(239,68,68,0.3);}
</style>
<script>requireAdmin(); document.write(renderAdminSidebar('visitors'));</script>
<div class="main">
  <div class="page-header">
    <div class="page-title"><h1>Visitors Management</h1><p>Approve, reject or review visitor entries</p></div>
  </div>
  <div class="stats-grid" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat-card"><h2 id="vs1" style="color:#f59e0b">--</h2><p>Today's Visitors</p></div>
    <div class="stat-card"><h2 id="vs2" style="color:#818cf8">--</h2><p>Pending</p></div>
    <div class="stat-card"><h2 id="vs3" style="color:#22c55e">--</h2><p>Approved</p></div>
    <div class="stat-card"><h2 id="vs4" style="color:#ef4444">--</h2><p>Rejected</p></div>
  </div>
  <div class="box">
    <div class="box-header"><span class="box-title">All Visitors</span></div>
    <div class="search-bar"><i class="fa fa-search"></i><input type="text" id="searchInput" placeholder="Search by name, house, or CNIC..." oninput="filterVisitors()"></div>
    <div class="filter-tabs">
      <button class="filter-tab active" onclick="setFilter('All',this)">All</button>
      <button class="filter-tab" onclick="setFilter('Pending',this)">⏳ Pending</button>
      <button class="filter-tab" onclick="setFilter('Approved',this)">✅ Approved</button>
      <button class="filter-tab" onclick="setFilter('Rejected',this)">❌ Rejected</button>
    </div>
    <div id="visitorsContainer"><div class="empty-state"><i class="fa fa-spinner spin"></i><br>Loading...</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
let allVisitors=[]; let currentFilter='All';

async function loadVisitors(){
  try{
    const res=await fetch(API+'/visitors'); allVisitors=await res.json();
    updateStats(); render();
  }catch(e){document.getElementById('visitorsContainer').innerHTML='<div class="empty-state"><i class="fa fa-plug"></i><br>Failed to load. Is Tomcat running?</div>';}
}

function updateStats(){
  const today=new Date().toISOString().split('T')[0];
  document.getElementById('vs1').textContent=allVisitors.filter(v=>v.created_at&&v.created_at.startsWith(today)).length;
  document.getElementById('vs2').textContent=allVisitors.filter(v=>v.status==='Pending').length;
  document.getElementById('vs3').textContent=allVisitors.filter(v=>v.status==='Approved').length;
  document.getElementById('vs4').textContent=allVisitors.filter(v=>v.status==='Rejected').length;
}

function render(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  let filtered=allVisitors.filter(v=>
    (currentFilter==='All'||v.status===currentFilter)&&
    (v.visitor_name.toLowerCase().includes(q)||(v.house_number||'').toLowerCase().includes(q)||(v.cnic||'').includes(q))
  );
  const c=document.getElementById('visitorsContainer');
  if(!filtered.length){c.innerHTML='<div class="empty-state"><i class="fa fa-user-slash"></i><br>No visitors found.</div>';return;}
  const badgeClass={Approved:'badge-green',Pending:'badge-yellow',Rejected:'badge-red'};
  c.innerHTML=filtered.map(v=>`
    <div class="visitor-card">
      <div class="vc-top">
        <div class="vc-user">
          <div class="vc-avatar">${v.visitor_name[0].toUpperCase()}</div>
          <div><div class="vc-name">${v.visitor_name}</div><div class="vc-sub">Visiting ${v.house_number||'N/A'}</div></div>
        </div>
        <span class="badge ${badgeClass[v.status]||'badge-blue'}">${v.status}</span>
      </div>
      <div class="vc-meta">
        <div class="meta-item"><label>Purpose</label><span>${v.purpose}</span></div>
        <div class="meta-item"><label>Vehicle</label><span>${v.vehicle_number||'—'}</span></div>
        <div class="meta-item"><label>Visit Time</label><span>${v.visit_time||'—'}</span></div>
        <div class="meta-item"><label>CNIC</label><span>${v.cnic||'—'}</span></div>
        <div class="meta-item"><label>Date</label><span>${v.created_at?v.created_at.split('T')[0]:v.created_at}</span></div>
        ${v.notes?`<div class="meta-item"><label>Notes</label><span>${v.notes}</span></div>`:''}
      </div>
      <div class="vc-actions">
        ${v.status==='Pending'?`
          <button class="btn-approve" onclick="updateStatus(${v.id},'Approved')">✓ Approve</button>
          <button class="btn-reject" onclick="updateStatus(${v.id},'Rejected')">✗ Reject</button>`:''}
        <button class="btn-del" onclick="deleteVisitor(${v.id})"><i class="fa fa-trash"></i></button>
      </div>
    </div>`).join('');
}

function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.filter-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function filterVisitors(){render();}

async function updateStatus(id,status){
  try{
    await fetch(API+'/visitors',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});
    showToast(status==='Approved'?'Visitor approved!':'Visitor rejected.', status==='Approved'?'success':'error');
    loadVisitors();
  }catch(e){showToast('Update failed','error');}
}
async function deleteVisitor(id){
  if(!confirm('Delete this visitor record?'))return;
  try{await fetch(API+'/visitors?id='+id,{method:'DELETE'}); showToast('Record deleted','success'); loadVisitors();}
  catch(e){showToast('Delete failed','error');}
}
function showToast(msg,type){
  const t=document.getElementById('toast');
  t.className=`toast toast-${type} show`;
  t.innerHTML=`<i class="fa ${type==='success'?'fa-check-circle':'fa-exclamation-circle'}"></i> ${msg}`;
  setTimeout(()=>t.classList.remove('show'),3000);
}
loadVisitors();
</script>
</body></html>
