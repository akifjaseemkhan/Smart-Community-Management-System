<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCMS Billing</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<script src="js/config.js"></script>
<script src="js/mock-api.js"></script>
<script src="sidebar.js"></script>
</head><body>
<script>document.write(sharedCSS);</script>
<script>requireAdmin(); document.write(renderAdminSidebar('billing'));</script>
<div class="main">
  <div class="page-header">
    <div class="page-title"><h1>Billing Management</h1><p>Add bills and track payments</p></div>
    <button class="btn btn-primary" onclick="toggleForm()"><i class="fa fa-plus"></i> Add Bill</button>
  </div>
  <div class="stats-grid" style="grid-template-columns:repeat(3,1fr)">
    <div class="stat-card"><h2 id="b1" style="color:#22c55e">--</h2><p>Paid Bills</p></div>
    <div class="stat-card"><h2 id="b2" style="color:#f59e0b">--</h2><p>Pending Bills</p></div>
    <div class="stat-card"><h2 id="b3" style="color:#ef4444">--</h2><p>Overdue Bills</p></div>
  </div>

  <div class="box" id="addForm" style="display:none;margin-bottom:20px;">
    <div class="box-header"><span class="box-title">➕ Add New Bill</span>
      <button class="btn btn-sm" style="background:var(--surface2);color:var(--muted)" onclick="toggleForm()">✕ Cancel</button>
    </div>
    <div class="form-grid">
      <div class="fg"><label>Resident ID</label><input type="number" id="bResId" placeholder="e.g. 2"></div>
      <div class="fg"><label>Apartment</label><input type="text" id="bApt" placeholder="e.g. A-203"></div>
      <div class="fg"><label>Service</label>
        <select id="bService"><option value="">Select service...</option>
          <option>Maintenance Fee</option><option>Parking Charges</option>
          <option>Security Charges</option><option>Water Charges</option>
          <option>Electricity Charges</option><option>Other</option>
        </select>
      </div>
      <div class="fg"><label>Month</label><input type="text" id="bMonth" placeholder="e.g. July 2026"></div>
      <div class="fg"><label>Amount (Rs.)</label><input type="number" id="bAmt" placeholder="5000"></div>
    </div>
    <button class="btn btn-primary" onclick="addBill()"><i class="fa fa-save"></i> Save Bill</button>
  </div>

  <div class="box">
    <div class="box-header"><span class="box-title">All Bills</span></div>
    <div class="search-bar"><i class="fa fa-search"></i><input type="text" id="searchInput" placeholder="Search by apartment, service, or month..." oninput="render()"></div>
    <div class="filter-tabs">
      <button class="filter-tab active" onclick="setFilter('All',this)">All</button>
      <button class="filter-tab" onclick="setFilter('Pending',this)">⏳ Pending</button>
      <button class="filter-tab" onclick="setFilter('Paid',this)">✅ Paid</button>
      <button class="filter-tab" onclick="setFilter('Overdue',this)">🔴 Overdue</button>
    </div>
    <table><thead><tr><th>Resident</th><th>Apartment</th><th>Service</th><th>Month</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead>
    <tbody id="billsBody"><tr><td colspan="7" style="text-align:center;color:var(--muted);padding:30px"><i class="fa fa-spinner spin"></i> Loading...</td></tr></tbody>
    </table>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
let allBills=[]; let currentFilter='All';
function toggleForm(){const f=document.getElementById('addForm'); f.style.display=f.style.display==='none'?'block':'none';}
async function loadBills(){
  try{const res=await fetch(API+'/bills'); allBills=await res.json(); updateStats(); render();}
  catch(e){}
}
function updateStats(){
  document.getElementById('b1').textContent=allBills.filter(b=>b.status==='Paid').length;
  document.getElementById('b2').textContent=allBills.filter(b=>b.status==='Pending').length;
  document.getElementById('b3').textContent=allBills.filter(b=>b.status==='Overdue').length;
}
function render(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  let filtered=allBills.filter(b=>
    (currentFilter==='All'||b.status===currentFilter)&&
    ((b.apartment||'').toLowerCase().includes(q)||(b.service||'').toLowerCase().includes(q)||(b.month||'').toLowerCase().includes(q)||(b.resident_name||'').toLowerCase().includes(q))
  );
  const tbody=document.getElementById('billsBody');
  if(!filtered.length){tbody.innerHTML='<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:30px">No bills found.</td></tr>';return;}
  const bc={Paid:'badge-green',Pending:'badge-yellow',Overdue:'badge-red'};
  tbody.innerHTML=filtered.map(b=>`
    <tr>
      <td><strong>${b.resident_name||'Resident #'+(b.resident_id||'?')}</strong></td>
      <td>${b.apartment}</td>
      <td>${b.service}</td>
      <td>${b.month}</td>
      <td><strong>Rs. ${parseFloat(b.amount).toLocaleString()}</strong></td>
      <td><span class="badge ${bc[b.status]||'badge-blue'}">${b.status}</span></td>
      <td>
        ${b.status!=='Paid'?`<button class="btn btn-primary btn-sm" onclick="markPaid(${b.id})">Mark Paid</button>`
        :`<span style="color:var(--muted);font-size:13px">✓ Paid</span>`}
      </td>
    </tr>`).join('');
}
function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.filter-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}
async function addBill(){
  const data={resident_id:parseInt(document.getElementById('bResId').value)||0,apartment:document.getElementById('bApt').value,service:document.getElementById('bService').value,month:document.getElementById('bMonth').value,amount:parseFloat(document.getElementById('bAmt').value)||0};
  if(!data.service||!data.month||!data.amount){showToast('Please fill all fields','error');return;}
  try{await fetch(API+'/bills',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    showToast('Bill added!','success');
    document.getElementById('bResId').value='';document.getElementById('bApt').value='';document.getElementById('bService').value='';document.getElementById('bMonth').value='';document.getElementById('bAmt').value='';
    document.getElementById('addForm').style.display='none'; loadBills();
  }catch(e){showToast('Failed to add bill','error');}
}
async function markPaid(id){
  try{await fetch(API+'/bills',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status:'Paid'})});showToast('Marked as Paid!','success');loadBills();}
  catch(e){showToast('Update failed','error');}
}
function showToast(msg,type){const t=document.getElementById('toast');t.className=`toast toast-${type} show`;t.innerHTML=`<i class="fa ${type==='success'?'fa-check-circle':'fa-exclamation-circle'}"></i> ${msg}`;setTimeout(()=>t.classList.remove('show'),3000);}
loadBills();
</script>
</body></html>
